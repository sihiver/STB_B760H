name: Build LineageOS 14.1 for ZTE B760H

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target (bacon / bootimage)'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bacon
          - bootimage
      sync_depth:
        description: 'Repo sync depth (1 to save disk space)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /var/lib/docker
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Swap Space (5 GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 5G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=5120
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up Java 8 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install and Configure Python 2.7
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y python2.7 python2.7-dev
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2.7 10
          sudo update-alternatives --set python /usr/bin/python2.7
          python --version

      - name: Set up Build Dependencies (Ubuntu 22.04)
        run: |
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses-dev lib32z1-dev liblz4-tool \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev libncurses6 libtinfo6 libncurses-dev || true
          
          # Relax ImageMagick security policy
          sudo sed -i 's/<policy domain="coder" rights="none"/<!-- <policy domain="coder" rights="none"/' /etc/ImageMagick-6/policy.xml || true
          
          # Ensure libncurses.so.5 & libtinfo.so.5 exist for prebuilt clang host binaries
          for lib in libncurses libtinfo; do
            if [ ! -f /usr/lib/x86_64-linux-gnu/${lib}.so.5 ] && [ -f /usr/lib/x86_64-linux-gnu/${lib}.so.6 ]; then
              sudo ln -sf /usr/lib/x86_64-linux-gnu/${lib}.so.6 /usr/lib/x86_64-linux-gnu/${lib}.so.5
            fi
            if [ ! -f /lib/x86_64-linux-gnu/${lib}.so.5 ] && [ -f /lib/x86_64-linux-gnu/${lib}.so.6 ]; then
              sudo ln -sf /lib/x86_64-linux-gnu/${lib}.so.6 /lib/x86_64-linux-gnu/${lib}.so.5
            fi
          done

          # Fix Jack Server TLS communication error (Error 51)
          if [ -n "$JAVA_HOME" ] && [ -f "$JAVA_HOME/jre/lib/security/java.security" ]; then
            sudo sed -i -e 's/TLSv1, TLSv1.1,//g' "$JAVA_HOME/jre/lib/security/java.security" || true
          fi
          
          # Install repo tool
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Configure Git & Environment
        run: |
          git config --global user.name "builder"
          git config --global user.email "builder@localhost"
          git config --global color.ui false
          
          # Setup Jack Server memory for Nougat
          echo "export JACK_SERVER_VM_ARGUMENTS=\"-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx4096m\"" >> $GITHUB_ENV
          
          # Disable ccache to save ~15GB disk space on ephemeral runner
          echo "export USE_CCACHE=0" >> $GITHUB_ENV

      - name: Inisialisasi LineageOS 14.1 Tree
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --depth=${{ inputs.sync_depth }}
          repo sync -c -j4 --no-tags --no-clone-bundle --force-sync

      - name: Copy Device, Kernel, & Vendor Trees
        run: |
          WORK_DIR="$GITHUB_WORKSPACE"
          cd ~/android/lineage
          
          # Device tree
          mkdir -p device/zte/B760H
          if [ -d "$WORK_DIR/android_device_zte_B760H" ]; then
            cp -r "$WORK_DIR/android_device_zte_B760H"/* device/zte/B760H/
          elif [ -f "$WORK_DIR/AndroidProducts.mk" ]; then
            cp -r "$WORK_DIR"/* device/zte/B760H/
          fi
          
          # Kernel tree
          mkdir -p kernel/zte/B760H
          if [ -d "$WORK_DIR/android_kernel_lenovo_mt8127" ]; then
            cp -r "$WORK_DIR/android_kernel_lenovo_mt8127"/* kernel/zte/B760H/
          else
            git clone --depth=1 -b cm-14.1 https://github.com/andrew264/android_kernel_lenovo_mt8127.git kernel/zte/B760H/
          fi
          
          # Copy custom b760h_defconfig from device tree into kernel tree
          if [ -f device/zte/B760H/configs/b760h_defconfig ]; then
            cp device/zte/B760H/configs/b760h_defconfig kernel/zte/B760H/arch/arm/configs/b760h_defconfig
          fi
          
          # Vendor tree
          mkdir -p vendor/zte/B760H
          if [ -d "$WORK_DIR/android_vendor_zte_B760H" ]; then
            cp -r "$WORK_DIR/android_vendor_zte_B760H"/* vendor/zte/B760H/
          elif [ -d "$WORK_DIR/vendor" ]; then
            cp -r "$WORK_DIR/vendor"/* vendor/zte/B760H/
          fi

      - name: Apply MT8127 Patches
        run: |
          cd ~/android/lineage
          bash device/zte/B760H/patches/patch.sh || true

      - name: Build ROM (${{ inputs.target }})
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          breakfast lineage_B760H-userdebug || lunch lineage_B760H-userdebug
          
          # Pre-build core framework packages sequentially to prevent race condition or parallel memory spike
          mka org.cyanogenmod.platform-res
          mka framework-res
          
          if [ "${{ inputs.target }}" = "bootimage" ]; then
            mka bootimage -j$(nproc)
          else
            mka bacon -j$(nproc)
          fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lineage-14.1-B760H-output
          path: |
            ~/android/lineage/out/target/product/B760H/*.zip
            ~/android/lineage/out/target/product/B760H/boot.img
            ~/android/lineage/out/target/product/B760H/system.img
            ~/android/lineage/out/target/product/B760H/recovery.img
          if-no-files-found: warn
